name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # A JDK 8 gives the tests a real rt.jar to index. Without one they skip
      # the standard-library assertions rather than fail, but the point of CI
      # is to run them.
      - name: Install JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Record the JDK location for the tests
        shell: bash
        run: |
          echo "FERRISJDT_TEST_RT_JAR=$JAVA_HOME/jre/lib/rt.jar" >> "$GITHUB_ENV"
          ls -l "$JAVA_HOME/jre/lib/rt.jar" || ls -l "$JAVA_HOME/lib/rt.jar"

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Tests
        run: cargo test --all-features

      # The release build is what is shipped, and the corpus tests are only
      # practical optimised.
      - name: Release tests
        run: cargo test --release --all-features

      - name: Self-check the fixture project
        shell: bash
        run: |
          cargo build --release
          ./target/release/ferrisjdt --self-check tests/fixtures/library --verbose

      # The fixture must stay something javac accepts, or the "no false
      # positives" claim is measured against the wrong baseline.
      - name: Compile the fixture with javac
        shell: bash
        run: |
          mkdir -p target/javac-out
          "$JAVA_HOME/bin/javac" -d target/javac-out $(find tests/fixtures/library -name '*.java')
