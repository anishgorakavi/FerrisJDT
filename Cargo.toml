[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
java-syntax = { path = "crates/java-syntax" }
java-classfile = { path = "crates/java-classfile" }
project-model = { path = "crates/project-model" }
java-semantic = { path = "crates/java-semantic" }
java-ide = { path = "crates/java-ide" }

lsp-types = "0.97"
lsp-server = "0.7"
tree-sitter = "0.25"
tree-sitter-java = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rustc-hash = "2"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
strip = true
